name: Nightly

run-name: 'Nightly ${{ github.ref_name }} · @${{ github.actor }}'

# Builds a nightly wheel from `main` and publishes it to PyPI as
# `coreai-opt-nightly` via Trusted Publishing (OIDC). The schedule, the skip
# rule, manual dry runs, and the one-time PyPI / `pypi-nightly` environment
# setup are described in RELEASE.md ("Nightly builds").
on:
  schedule:
    # 08:23 UTC = 00:23 PST / 01:23 PDT. Off the top of the hour, when GitHub
    # delays scheduled runs the most.
    - cron: '23 8 * * *'
  # Manual run: trigger from the Actions tab ("Nightly" -> "Run workflow") or
  # `gh workflow run nightly.yml --ref <branch>`.
  workflow_dispatch:

# Least privilege by default; jobs opt into what they need.
permissions:
  contents: read

concurrency:
  # One nightly at a time, and never cancel an in-flight publish.
  group: nightly
  cancel-in-progress: false

jobs:
  # ── Decide whether `main` has moved since the last successful nightly. ──
  changes:
    name: Check for new commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # list this workflow's previous runs
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Compare with the last successful nightly
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A failed nightly doesn't count as successful, so the next scheduled
          # run retries its commit. Manual runs always build.
          last_sha="$(gh run list --workflow nightly.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')"
          echo "HEAD=${GITHUB_SHA}  last successful nightly=${last_sha:-none}"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "${last_sha}" = "${GITHUB_SHA}" ]; then
            echo "main is still at the last successful nightly; skipping."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

  # ── Build the exact wheel that will be published. ──
  build:
    name: Build nightly wheel
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
      - name: Build nightly wheel
        run: make build-nightly
      - name: Upload wheel
        # Nightlies ship the wheel; the sdist ships with releases (release.yml).
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-wheel
          path: dist/*.whl
          if-no-files-found: error

  # ── Publish to PyPI via Trusted Publishing. Only this job holds `id-token`. ──
  # It builds nothing and runs no project code: it just downloads the built
  # wheel and uploads it, keeping build dependencies out of the OIDC-privileged
  # job. Skipped along with `build` when `main` hasn't moved.
  publish:
    name: Publish to PyPI
    needs: build
    # Publish only from `main` (scheduled, or a manual run on `main`) and never from forks.
    if: github.repository == 'apple/coreai-optimization' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi-nightly
      url: https://pypi.org/p/coreai-opt-nightly
    permissions:
      id-token: write # mint the OIDC token for Trusted Publishing and attestation signing
      contents: read
    steps:
      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-wheel
          path: dist/
      - name: Publish to PyPI
        # Uploads via Trusted Publishing and signs a PEP 740 attestation for each
        # file with this workflow's OIDC identity, so PyPI shows its provenance.
        uses: pypa/gh-action-pypi-publish@release/v1
